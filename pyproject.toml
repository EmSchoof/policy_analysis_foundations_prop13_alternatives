[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-analysis-foundations-prop13-alternatives"
version = "0.1.0"
description = "Outcome projections for the PPD 554 Prop 13 policy alternatives"
requires-python = ">=3.10"
# The model itself imports only numpy + csv (same rule as the Ontario model).
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["prop13_forecast"]
